name: v2 — CI, build & deploy

on:
  push:
    branches: [master]
    paths: ['apps/**', 'packages/**', 'pnpm-lock.yaml', 'docker-compose.v2.prod.yml', '.github/workflows/deploy-v2.yml']
  pull_request:
    paths: ['apps/**', 'packages/**', 'pnpm-lock.yaml']
  workflow_dispatch:

env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/personal-kb-v2

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm depcruise
      - run: pnpm test
      - name: Integration tests (real MySQL 8)
        run: pnpm --filter @pkb/api test:int
        env: { IT_DATABASE_URL: 'mysql://root:root@127.0.0.1:3306' }

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}-api:latest,${{ env.IMAGE_BASE }}-api:${{ github.sha }}
          cache-from: type=gha,scope=v2-api
          cache-to: type=gha,mode=max,scope=v2-api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}-web:latest,${{ env.IMAGE_BASE }}-web:${{ github.sha }}
          cache-from: type=gha,scope=v2-web
          cache-to: type=gha,mode=max,scope=v2-web

  deploy:
    needs: build
    runs-on: [self-hosted]
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Pull, migrate, restart
        env:
          TAG: ${{ github.sha }}
        run: |
          docker compose -f docker-compose.v2.prod.yml pull
          # Safety net before touching the schema (no-op unless BACKUP_BUCKET is set).
          docker compose -f docker-compose.v2.prod.yml run --rm --no-deps api sh -c '[ -z "$BACKUP_BUCKET" ] || node dist/scripts/backup.js'
          # Migrations first; if they fail the step fails and the running app is untouched.
          docker compose -f docker-compose.v2.prod.yml run --rm --no-deps api node dist/migrate.js
          docker compose -f docker-compose.v2.prod.yml up -d
          docker image prune -f
