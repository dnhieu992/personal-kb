services:
  # MySQL is NOT run in Docker. This project reuses the host MySQL on 3306
  # (the same instance market-analysis uses), with its own `personal_kb`
  # database and `pkb` user. See backend/.env (DATABASE_URL, Option A).
  qdrant:
    image: qdrant/qdrant
    container_name: pkb-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
